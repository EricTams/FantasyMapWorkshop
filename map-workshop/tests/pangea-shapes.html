<!doctype html><html><meta charset="utf-8"><title>Pangea silhouettes</title><style>body{background:#182a31;color:#e8e4cf;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(3,280px);gap:20px}h2{font-size:15px}canvas{display:block}a{color:#ceb88a}</style><h1>Pangea silhouettes</h1><p>Same seed across each row. Coast complexity increases left to right. Left and right edges connect.</p><a href="../">Map workshop</a><main id="views"></main><script type="module">
import {generateWorld} from '../generator.js?v=24d';
for(const seed of ['wildwood-1701','shape-2','shape-7'])for(const complexity of [0,60,100]){const w=generateWorld(seed,{size:28,land:58,complexity}),section=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas');h.textContent=`${seed} · ${complexity}%`;canvas.width=280;canvas.height=210;const ctx=canvas.getContext('2d');ctx.fillStyle='#215b79';ctx.fillRect(0,0,280,210);ctx.fillStyle='#a6ae76';for(const c of w.cells)if(c.land)ctx.fillRect(c.x*10,c.y*7.5,10,7.5);section.append(h,canvas);document.querySelector('#views').append(section);}
</script></html>
