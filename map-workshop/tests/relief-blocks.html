<!doctype html><html lang="en"><meta charset="utf-8"><title>Broad relief — 3 × 3 blocks</title><style>body{background:#192b24;color:#eee8d7;font:16px system-ui;margin:24px}main{display:flex;flex-wrap:wrap;gap:20px}canvas{width:512px;height:384px}h2{font-size:18px}p{max-width:1050px}a{color:#dcc492}</style><h1>Broad relief — 3 × 3 blocks</h1><p>Continuous raised ground with area-distributed knolls. Each view has a 3 × 3 relief block and a half-tile margin. Alpine forest uses the same landform as bare hills.</p><p><a href="../">Map workshop</a> · <a href="connected-relief.html">Narrow chain comparison</a></p><main></main><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js';
await loadAssets();const w=generateWorld('broad-relief-study');w.rivers=[];for(const c of w.cells){c.land=true;c.terrain='grassland';c.relief=c.vegetation=c.resource=null;}
const scenes=[{x:2,y:2,label:'3 × 3 hills'},{x:8,y:2,label:'3 × 3 Alpine hills'},{x:2,y:9,label:'Mountain core with foothills'}];
scenes.forEach((s,i)=>{for(let y=s.y;y<s.y+3;y++)for(let x=s.x;x<s.x+3;x++){const c=w.cells[y*16+x];c.relief=i===2&&x===s.x+1&&y===s.y+1?'mountain':'hill';c.vegetation=i===1?'alpine':null;}});
const art=renderWorld(w,hashSeed(w.seed));for(const s of scenes){const section=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=s.label;c.width=512;c.height=384;c.getContext('2d').drawImage(art,(s.x-.5)*128,(s.y-.5)*96,512,384,0,0,512,384);section.append(h,c);document.querySelector('main').append(section);}
</script></html>
