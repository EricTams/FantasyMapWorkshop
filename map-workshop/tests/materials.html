<!doctype html><html lang="en"><meta charset="utf-8"><title>Atlas material continuity diagnostics</title><style>body{background:#182328;color:white;font:16px system-ui;margin:24px}canvas{display:block;width:min(100%,960px);height:auto;margin:18px 0 40px}</style><h1>Material continuity</h1><p>Fixed seed: material-check. No vegetation, relief, rivers or resources. Inspect repeat boundaries independently of biome blending.</p><h2>Flat grassland field</h2><div id="flat"></div><h2>Four-way junction: grassland, plains, desert, grassland</h2><div id="mixed"></div><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js';
// Asset paths resolve relative to renderer.js, preserving the copied asset hierarchy.
await loadAssets();const w=generateWorld('material-check');w.rivers=[];for(const c of w.cells){c.land=true;c.terrain='grassland';c.vegetation=c.relief=c.resource=null;}document.querySelector('#flat').append(renderWorld(w,hashSeed(w.seed)));for(const c of w.cells)c.terrain=c.x<8?(c.y<8?'grassland':'desert'):(c.y<8?'plains':'grassland');document.querySelector('#mixed').append(renderWorld(w,hashSeed(w.seed)));
</script></html>
