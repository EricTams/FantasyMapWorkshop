<!doctype html><html lang="en"><meta charset="utf-8"><title>Individual resource sprites</title><style>body{background:#182328;color:#eee;font:16px system-ui;margin:24px}main{display:flex;flex-wrap:wrap;gap:24px}canvas{width:576px;max-width:100%;height:auto}h2{font-size:18px}</style><h1>Resources mixed with woodland</h1><p>Individual stags and pepper bushes, ordered by their own ground anchors. Rear foliage may overlap; identifying upper shapes remain protected.</p><main id="views"></main><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js';
await loadAssets();const w=generateWorld('resource-groups');w.rivers=[];for(const c of w.cells){c.land=true;c.terrain='grassland';c.relief=c.resource=null;c.vegetation='broadleaf';}w.cells[7*16+5].resource='white_stags';w.cells[7*16+10].resource='scarlet_pepper';const image=renderWorld(w,hashSeed(w.seed));
for(const [x,label] of [[5,'White stags'],[10,'Scarlet pepper']]){const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas');heading.textContent=label;canvas.width=384;canvas.height=288;canvas.getContext('2d').drawImage(image,(x-1)*128,6*96,384,288,0,0,384,288);section.append(heading,canvas);document.querySelector('#views').append(section);}
</script></html>
