<!doctype html><html lang="en"><meta charset="utf-8"><title>Forest river visibility</title><style>body{background:#182328;color:#eee;font:16px system-ui;margin:24px}canvas{display:block;width:min(100%,1200px);height:auto}p{max-width:1000px}</style><h1>Canopy clearance at river crossings</h1><p>Broadleaf, pine and jungle. Horizontal and vertical rivers use the shared displacement field. Trunks stay anchored; visible foliage must leave the channel clear.</p><p id="result">Rendering diagnostic…</p><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js';import {makeGeometry,displacement} from '../geometry.js';
await loadAssets();const w=generateWorld('canopy-check');for(const c of w.cells){c.land=true;c.terrain='grassland';c.relief=c.resource=c.vegetation=null;}w.rivers=[{nodes:Array.from({length:13},(_,i)=>[i+2,8])},{nodes:Array.from({length:13},(_,i)=>[8,i+2])}];const seed=hashSeed(w.seed),base=renderWorld(w,seed);for(const c of w.cells)c.vegetation=c.x<5?'broadleaf':c.x<10?'pine':'jungle';const forest=renderWorld(w,seed);document.body.append(forest);
const a=base.getContext('2d').getImageData(0,0,2048,1536).data,b=forest.getContext('2d').getImageData(0,0,2048,1536).data,g=makeGeometry(w);let checked=0,changed=0;
for(let y=96;y<1440;y+=2)for(let x=128;x<1920;x+=2){const d=displacement(seed,x,y),r=g.riverDistance(x+d[0],y+d[1]);if(r.distance>1||r.progress<50)continue;checked++;const i=(y*2048+x)*4;if(Math.max(...[0,1,2].map(k=>Math.abs(a[i+k]-b[i+k])))>8)changed++;}
document.querySelector('#result').textContent=`${checked} channel-center samples checked; ${changed} obscured by tree sprites (RGB tolerance 8).`;
</script></html>
