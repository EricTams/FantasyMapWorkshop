<!doctype html><html lang="en"><meta charset="utf-8"><title>Animal ground shadows</title><style>body{background:#1e2c25;color:#ece9dc;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(2,384px);gap:20px}h2{font-size:18px;margin:0 0 10px}canvas{display:block;width:384px;height:288px}a{color:#cdbb87}</style><h1>Animal ground shadows</h1><p>White stags and aurochs at native map scale. Soft contact shadows are drawn on the ground before all sprites.</p><p><a href="../">Map workshop</a></p><main id="views"></main><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js?v=23';
await loadAssets();const w=generateWorld('animal-shadows');w.rivers=[];for(const c of w.cells){c.land=true;c.terrain='grassland';c.relief=c.resource=c.vegetation=null;}w.cells[7*16+5].resource='white_stags';w.cells[7*16+10].resource='aurochs';
const before=renderWorld(w,hashSeed(w.seed),{animalShadows:false}),after=renderWorld(w,hashSeed(w.seed));
for(const [x,label] of [[5,'White stags'],[10,'Aurochs']])for(const [image,state] of [[before,'Before'],[after,'With shadows']]){const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas');heading.textContent=`${label} · ${state}`;canvas.width=384;canvas.height=288;canvas.getContext('2d').drawImage(image,(x-1)*128,6*96,384,288,0,0,384,288);section.append(heading,canvas);document.querySelector('#views').append(section);}
</script></html>
