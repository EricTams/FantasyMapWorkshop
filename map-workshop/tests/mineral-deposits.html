<!doctype html><html lang="en"><meta charset="utf-8"><title>Mineral deposits at map scale</title><style>body{background:#192b24;color:#eee8d7;font:16px system-ui;margin:24px}main{display:flex;gap:20px;flex-wrap:wrap}canvas{display:block;width:384px;height:288px}h2{font-size:18px;text-transform:capitalize}p{max-width:1050px}a{color:#dcc492}</style><h1>Mineral deposits at map scale</h1><p>Mithril in fractured silver-bearing rock, embedded gemstones, and a dark voidstone outcrop. Each panel is a 3 × 3 tile crop at native map resolution.</p><a href="../">Map workshop</a><main></main><script type="module">
import {generateWorld,hashSeed} from '../generator.js';import {loadAssets,renderWorld} from '../renderer.js?v=18';
await loadAssets();const w=generateWorld('mineral-study');w.rivers=[];for(const c of w.cells){c.land=true;c.terrain='grassland';c.relief=c.vegetation=c.resource=null;}
const kinds=['mithril','gems','voidstone'];for(let i=0;i<3;i++){const x=3+i*5;w.cells[7*16+x].resource=kinds[i];w.cells[7*16+x].relief='hill';w.cells[6*16+x].relief='hill';w.cells[7*16+x+1].relief='hill';w.cells[7*16+x+1].vegetation='alpine';}
const art=renderWorld(w,hashSeed(w.seed));for(let i=0;i<3;i++){const section=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=kinds[i];c.width=384;c.height=288;c.getContext('2d').drawImage(art,(2+i*5)*128,6*96,384,288,0,0,384,288);section.append(h,c);document.querySelector('main').append(section);}
</script></html>
